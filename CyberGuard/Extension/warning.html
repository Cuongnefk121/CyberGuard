<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CyberGuard - Cảnh báo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #32120f,
                    #090607 65%
                );

            color: white;

            font-family: Arial, sans-serif;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 700px;

            padding: 45px 35px;

            text-align: center;

            background: #110d0d;

            border: 1px solid #6b2924;

            border-radius: 20px;

            box-shadow:
                0 0 45px rgba(
                    255,
                    60,
                    40,
                    0.15
                );
        }

        .warning-icon {
            font-size: 75px;

            margin-bottom: 15px;
        }

        h1 {
            color: #ff6257;

            font-size: 38px;

            margin-bottom: 15px;
        }

        .subtitle {
            color: #d6c6c4;

            font-size: 18px;

            margin-bottom: 25px;
        }

        .domain-box {
            padding: 18px;

            background: #090707;

            border-radius: 10px;

            border: 1px solid #47201d;

            margin: 20px 0;
        }

        #domain {
            color: #ff8077;

            font-size: 18px;

            word-break: break-all;
        }

        .detection {
            margin: 20px 0;

            padding: 15px;

            background: #261210;

            border-radius: 10px;

            color: #ffb3ad;
        }

        #malicious {
            font-size: 25px;

            color: #ff6257;

            font-weight: bold;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 30px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            padding: 14px 24px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        #back {
            background: #ff6257;

            color: white;
        }

        #back:hover {
            transform: translateY(-2px);

            background: #ff4437;
        }

        #continue {
            background: transparent;

            color: #c7b7b5;

            border: 1px solid #67403b;
        }

        #continue:hover {
            background: #241614;

            color: white;
        }

        .note {
            margin-top: 25px;

            color: #806f6c;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="warning-icon">
            ⚠️
        </div>

        <h1>
            Cảnh báo bảo mật
        </h1>

        <p class="subtitle">
            CyberGuard phát hiện dấu hiệu đáng ngờ
            trên website này.
        </p>

        <div class="domain-box">

            <div>
                Website:
            </div>

            <strong id="domain">
                Đang tải...
            </strong>

        </div>

        <div class="detection">

            VirusTotal phát hiện:

            <div>
                <span id="malicious">
                    0
                </span>

                engine có kết quả
                <strong>malicious</strong>.
            </div>

        </div>

        <div class="buttons">

            <button id="back">
                ← Quay lại
            </button>

            <button id="continue">
                Tôi hiểu, tiếp tục
            </button>

        </div>

        <div class="note">
            Chỉ tiếp tục nếu bạn tin tưởng website này.
        </div>

    </div>


    <script src="warning.js"></script>

</body>

</html>
