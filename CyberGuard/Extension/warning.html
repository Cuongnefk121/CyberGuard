<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        CyberGuard Warning
    </title>


    <style>

        body
        {
            margin: 0;

            min-height: 100vh;

            background: #101010;

            color: white;

            font-family: Arial;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .box
        {
            width: 600px;

            padding: 40px;

            background: #1d1d1d;

            border-radius: 15px;

            text-align: center;
        }


        .shield
        {
            font-size: 70px;
        }


        h1
        {
            font-size: 32px;
        }


        .danger
        {
            font-size: 23px;

            margin: 20px;
        }


        .domain
        {
            padding: 15px;

            background: #292929;

            border-radius: 8px;

            word-break: break-all;

            margin: 20px 0;
        }


        .count
        {
            font-size: 20px;

            margin: 20px;
        }


        button
        {
            padding: 13px 25px;

            margin: 8px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;
        }


        #back
        {
            background: #555;

            color: white;
        }


        #continue
        {
            background: #8b0000;

            color: white;
        }

    </style>

</head>


<body>


<div class="box">


    <div class="shield">
        🛡️
    </div>


    <h1>
        CYBERGUARD
    </h1>


    <div class="danger">
        ⚠️ POTENTIALLY DANGEROUS WEBSITE
    </div>


    <p>
        CyberGuard detected multiple security
        engines flagging this website.
    </p>


    <div
        class="domain"
        id="domain">

        Loading...

    </div>


    <div
        class="count"
        id="count">

        Malicious detections: ...

    </div>


    <p>
        We recommend leaving this website.
    </p>


    <button id="back">
        Go Back
    </button>


    <button id="continue">
        I Understand, Continue
    </button>


</div>


<script src="warning.js"></script>


</body>

</html>
