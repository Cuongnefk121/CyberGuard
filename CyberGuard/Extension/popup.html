<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CyberGuard</title>

    <link rel="stylesheet"
          href="popup.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <div class="logo">
                🛡️
            </div>

            <div>

                <h1>
                    CyberGuard
                </h1>

                <p>
                    Website Security
                </p>

            </div>

        </div>


        <div class="status">

            <span class="dot"></span>

            Protection Active

        </div>


        <div class="separator"></div>


        <h2>
            Kiểm tra website
        </h2>


        <input
            id="domain"
            type="text"
            placeholder="example.com"
            autocomplete="off"
        >


        <button id="check">
            🔍 Kiểm tra
        </button>


        <div id="result">
            Nhập tên miền để kiểm tra.
        </div>


        <div class="info">

            <div>
                🔎 VirusTotal
            </div>

            <div>
                ☁️ Cloud Backend
            </div>

            <div>
                🛡️ CyberGuard Protection
            </div>

        </div>


        <div class="footer">

            CyberGuard © 2026

        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
