<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CyberGuard - Đang kiểm tra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #073047,
                    #050b14 65%
                );

            color: white;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 600px;

            padding: 45px 30px;

            text-align: center;

            background: #0a1522;

            border: 1px solid #17304a;

            border-radius: 20px;

            box-shadow:
                0 0 40px rgba(0, 229, 255, 0.12);
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #00e5ff;

            font-size: 35px;

            margin-bottom: 15px;
        }

        #status {
            font-size: 20px;

            color: #d9e7f2;

            margin-top: 20px;
        }

        #result {
            margin-top: 15px;

            color: #8fa6b8;

            font-size: 15px;
        }

        .loader {
            width: 45px;
            height: 45px;

            margin: 25px auto;

            border: 4px solid #17304a;

            border-top:
                4px solid #00e5ff;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .small {
            margin-top: 25px;

            color: #64798a;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">
            🛡️
        </div>

        <h1>
            CyberGuard
        </h1>

        <div class="loader"></div>

        <div id="status">
            Đang kiểm tra website...
        </div>

        <div id="result"></div>

        <div class="small">
            CyberGuard đang phân tích website bằng VirusTotal.
        </div>

    </div>

    <script src="check.js"></script>

</body>

</html>
