<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        CyberGuard
    </title>

    <style>

        body
        {
            margin: 0;

            min-height: 100vh;

            background: #101010;

            color: white;

            font-family: Arial;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .box
        {
            width: 500px;

            padding: 40px;

            background: #1d1d1d;

            border-radius: 15px;

            text-align: center;
        }


        .shield
        {
            font-size: 70px;
        }


        h1
        {
            font-size: 30px;
        }


        #status
        {
            font-size: 20px;

            margin-top: 25px;
        }


        #domain
        {
            margin-top: 20px;

            padding: 15px;

            background: #292929;

            border-radius: 8px;

            word-break: break-all;
        }

    </style>

</head>


<body>


<div class="box">

    <div class="shield">
        🛡️
    </div>


    <h1>
        CYBERGUARD
    </h1>


    <div id="status">
        Checking website...
    </div>


    <div id="domain">
        Loading...
    </div>

</div>


<script src="check.js"></script>


</body>

</html>
